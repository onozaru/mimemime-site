<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お申し込みありがとうございます | mimemime</title>
<meta name="robots" content="noindex">
<style>
  :root{--main:#3A7CA5;--accent:#EC7C95;--dark:#1F3A4D;--gray:#7F8C8D;--bg:#F4F8FB;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:var(--bg);color:var(--dark);line-height:1.9;}
  nav{background:var(--dark);padding:0 24px;display:flex;align-items:center;height:56px;}
  nav a{color:#fff;text-decoration:none;font-weight:700;font-size:15px;}
  main{max-width:560px;margin:0 auto;padding:60px 20px;text-align:center;}
  h1{font-size:22px;margin-bottom:16px;}
  p{color:var(--gray);font-size:15px;margin-bottom:12px;}
  .card{background:#fff;border-radius:16px;border:1px solid #E3EBF2;padding:28px 24px;margin-top:24px;text-align:left;}
  .card p{color:var(--dark);opacity:.85;}
  a.back{display:inline-block;margin-top:28px;color:var(--main);text-decoration:none;font-weight:700;}
</style>
</head>
<body>
<nav><a href="/">mimemime</a></nav>
<main>
  <h1>お申し込み、ありがとうございます</h1>
  <p>「おのざる」より、24時間以内を目安にメールでご連絡します。</p>
  <div class="card">
    <p>今は少人数での試験提供のため、日程調整に少しお時間をいただく場合があります。気長にお待ちいただけると嬉しいです。</p>
  </div>
  <a class="back" href="/">トップページへ戻る</a>
</main>
</body>
</html>
