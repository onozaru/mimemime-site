<style>
:root{
  --pink:#EC7C95;
  --pink-deep:#D45F7B;
  --pink-pale:#FBE7EC;
  --brown:#BA8478;
  --brown-deep:#8A5F55;
  --cream:#FFF9F4;
  --cream-2:#FFF2E8;
  --ink:#3A2E2B;
  --ink-soft:#7A6F6B;
  --green:#8FB996;
  --radius-lg:24px;
  --radius-md:16px;
  --shadow:0 10px 30px rgba(122,88,80,.16);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:'Hiragino Sans','Noto Sans JP','Meiryo',sans-serif;
  background:var(--cream);
  color:var(--ink);
  line-height:1.8;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}

.topbar{
  position:sticky;top:0;z-index:100;
  background:rgba(255,249,244,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid rgba(122,88,80,.12);
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 18px;height:56px;
}
.topbar-logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:1.05rem;color:var(--brown-deep);}
.topbar-logo-img{height:28px;width:auto;display:block;}
.backlink{font-size:.8rem;font-weight:bold;color:var(--brown-deep);}

.wrap{max-width:520px;margin:0 auto;padding:44px 20px 70px;text-align:center;}
.eyebrow{
  display:inline-block;font-size:.7rem;font-weight:bold;color:var(--pink-deep);
  background:var(--pink-pale);border-radius:20px;padding:4px 14px;margin-bottom:14px;letter-spacing:.05em;
}
h1{font-size:clamp(1.3rem,5.5vw,1.7rem);font-weight:900;margin-bottom:12px;}
.lede{font-size:.9rem;color:var(--ink-soft);margin-bottom:30px;line-height:1.9;}

.line-banner{
  display:block;border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);
  transition:transform .15s;margin-bottom:14px;
}
.line-banner:active{transform:scale(.98);}
.line-banner img{width:100%;height:auto;display:block;}
.banner-note{font-size:.72rem;color:var(--ink-soft);margin-bottom:40px;}

.other-note{
  background:#fff;border-radius:var(--radius-lg);padding:22px;box-shadow:var(--shadow);
  font-size:.85rem;color:var(--ink-soft);text-align:left;
}
.other-note b{color:var(--ink);}
.other-note a{color:var(--pink-deep);font-weight:bold;}

footer{padding:32px 20px 60px;text-align:center;}
footer .foot-links{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-bottom:10px;}
footer .foot-links a{font-size:.78rem;color:var(--ink-soft);}
footer .copyright{font-size:.68rem;color:var(--ink-soft);opacity:.7;}
