<style>
:root{
  --cream:#FFF9F4;--cream-2:#FFF2E8;
  --pink:#EC7C95;--pink-deep:#D45F7B;--pink-pale:#FBE7EC;
  --brown:#BA8478;--brown-deep:#8A5F55;
  --ink:#3A2E2B;--ink-soft:#7A6F6B;
  --radius-lg:24px;--radius-md:16px;
  --shadow:0 10px 30px rgba(122,88,80,.16);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Hiragino Sans','Noto Sans JP','Meiryo',sans-serif;background:var(--cream);color:var(--ink);line-height:1.8;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}
img{max-width:100%;display:block;}

.topbar{
  position:sticky;top:0;z-index:100;
  background:rgba(255,249,244,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid rgba(122,88,80,.12);
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 18px;height:56px;
}
.topbar-logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:1.05rem;color:var(--brown-deep);}
.topbar-logo-img{height:28px;width:auto;display:block;}
.backlink{font-size:.8rem;font-weight:bold;color:var(--brown-deep);}

.wrap{max-width:520px;margin:0 auto;padding:60px 20px 80px;text-align:center;}
.eyebrow{
  display:inline-block;font-size:.7rem;font-weight:bold;color:var(--pink-deep);
  background:var(--pink-pale);border-radius:20px;padding:4px 14px;margin-bottom:14px;letter-spacing:.05em;
}
h1{font-size:clamp(1.2rem,5vw,1.5rem);font-weight:900;margin-bottom:16px;}
.lede{font-size:.88rem;color:var(--ink-soft);margin-bottom:30px;line-height:1.9;}

.card{background:#fff;border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow);text-align:left;margin-bottom:14px;}
.card h2{font-size:.95rem;margin-bottom:8px;}
.card p{font-size:.82rem;color:var(--ink-soft);margin-bottom:14px;}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:var(--pink);color:#fff;font-weight:900;border:none;
  padding:14px 24px;border-radius:50px;font-size:.9rem;cursor:pointer;
  box-shadow:0 10px 26px rgba(236,124,149,.4);
}
.btn-outline{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:#fff;color:var(--brown-deep);font-weight:bold;border:1.5px solid rgba(122,88,80,.3);
  padding:12px 24px;border-radius:50px;font-size:.86rem;
}

footer{padding:32px 20px 60px;text-align:center;}
footer .foot-links{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-bottom:10px;}
footer .foot-links a{font-size:.78rem;color:var(--ink-soft);}
footer .copyright{font-size:.68rem;color:var(--ink-soft);opacity:.7;}
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="topbar-logo">
    <img src="assets/mimemime-logo-horizontal.png" alt="mimemime" class="topbar-logo-img">
  </a>
  <a href="index.html" class="backlink">← トップに戻る</a>
</div>

<div class="wrap">
  <span class="eyebrow">お知らせ</span>
  <h1>求人ガイドページは、<br>現在ご案内を休止しています</h1>
  <p class="lede">求人情報の掲載方法を見直しているため、このページでの個別求人のご紹介は一時的にお休みしています。ご不便をおかけしますが、ご了承ください。</p>

  <div class="card">
    <h2>お仕事探しのご相談は、個別対応します</h2>
    <p>「どんな仕事が合うか分からない」「まず話を聞いてほしい」という場合は、オンライン相談で一緒に整理できます。</p>
    <button class="btn" onclick="location.href='connect.html'">LINEで相談する →</button>
  </div>

  <div class="card">
    <h2>求人サイトを比較したい方へ</h2>
    <p>障害者雇用に対応した主要な求人サイトの特徴をまとめたページもあります。</p>
    <button class="btn-outline" onclick="location.href='compare.html'">求人サイト比較を見る</button>
  </div>
</div>

<footer>
  <div class="foot-links">
    <a href="index.html">トップ</a>
    <a href="compare.html">サイト比較</a>
    <a href="blog/index.html">ブログ</a>
    <a href="tokushoho.html">特定商取引法</a>
  </div>
  <p class="copyright">© mimemime</p>
</footer>

</body>
</html>
